# Render Blueprint: Render → New → Blueprint → pick this repository.
# The database lives on Neon (free, doesn't expire); paste its connection string as DATABASE_URL when asked.
# Clients open their own accounts in the app ("Create account"), so no admin login is needed here.
services:
  - type: web
    name: stockflow
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: INBOUND_TOKEN
        generateValue: true
      - key: MPESA_CALLBACK_TOKEN
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: localhost
      - key: TIME_ZONE
        value: Africa/Nairobi
      - key: CURRENCY
        value: KES
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SMS_BACKEND
        value: console
      - key: WHATSAPP_BACKEND
        value: console
      # Forgot-password emails (Gmail App Password goes in EMAIL_HOST_PASSWORD; set it in the Render dashboard)
      - key: EMAIL_HOST_USER
        value: vinwonder05@gmail.com
      - key: DEFAULT_FROM_EMAIL
        value: StockFlow <vinwonder05@gmail.com>
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # M-Pesa: console = test mode until you add Daraja keys (MPESA_BACKEND=daraja, MPESA_CONSUMER_KEY, …)
      - key: MPESA_BACKEND
        value: console
      - key: GOOGLE_MAPS_API_KEY
        sync: false
